site_name: Modul 319 – Programmieren Grundlagen in C#
site_description: Unterrichtsmaterial für das Modul 319 an der BBZW Sursee
site_author: Dr. Andreas Fischer
site_url: https://af81.github.io/csharp-school/
copyright: Copyright &copy; 2025 Dr. Andreas Fischer
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
theme:
  name: material
  logo: img/csharp-logo.png
  language: de
  features:
    - navigation.instant
    - navigation.tracking
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: yellow
      accent: pink
      toggle:
        icon: material/weather-night
        name: Dunkelmodus
    - scheme: slate
      primary: yellow
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Hellmodus
nav:
  - Startseite: index.md
  - Semesterplan: semesterplan.md
  - Theorie:
      - Grundlagen Programmierung: theorie/computer-programm.md
      - Git und GitHub: theorie/git.md
  - Aufgaben:
      - "Setup":
        - VS Code & .NET SDK: aufgaben/vscode-setup.md
        - Git & GitHub: aufgaben/git-setup.md
      - "Erste Schritte":
        - Wichtige Begriffe lernen: aufgaben/begriffe.md
        - Hello World mit C#: aufgaben/helloworld.md
      - "Git & GitHub":
        - Das erste Repository: aufgaben/git.md
        - Änderungen nachvollziehen: aufgaben/git-commit.md
        - Änderungen rückgängig machen: aufgaben/git-change.md
        - Github-Repos verbinden: aufgaben/github.md
      #  - GitHub Teamübung: aufgaben/github-team.md
      # - Variablen und Datentypen: aufgaben/variablen-datentypen.md
      # - Einfache Ein- und Ausgabe: aufgaben/einfach-ein-ausgabe.md
      # - Bedingungen (if, else, switch): aufgaben/bedingungen.md
      # - Schleifen (for, while, do-while): aufgaben/schleifen.md
      # - Funktionen (Methoden): aufgaben/funktionen-methoden.md
      # - Arrays und Listen: aufgaben/arrays-listen.md
      # - Klassen und Objekte: aufgaben/klassen-objekte.md
      # - Fehlerbehandlung (try-catch): aufgaben/fehlerbehandlung.md
      # - Arbeiten mit Dateien: aufgaben/dateien.md
      # - Einführung in die objektorientierte Programmierung: aufgaben/oop-einfuehrung.md-
  - Klassenregeln: regeln.md
  - Ressourcen:
      - Wichtige Terminal-Befehle: ressourcen/terminal.md
      #- Nützliche Links: ressourcen/links.md
