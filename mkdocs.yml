site_name: Modul 319 – Programmieren Grundlagen in C#
site_description: Unterrichtsmaterial für das Modul 319 an der BBZW Sursee
site_author: Dr. Andreas Fischer
site_url: https://af81.github.io/csharp-school/
copyright: Copyright &copy; 2025 Dr. Andreas Fischer
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
theme:
  name: material
  logo: img/csharp-logo.png
  language: de
  features:
    - navigation.instant
    - navigation.tracking
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: yellow
      accent: pink
      toggle:
        icon: material/weather-night
        name: Dunkelmodus
    - scheme: slate
      primary: yellow
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Hellmodus
nav:
  - Startseite: index.md
  - Semesterplan: semesterplan.md
  - Theorie:
      - Grundlagen Programmierung: theorie/computer-programm.md
      - Git und GitHub: theorie/git.md
  - Übungen:
      - Entwicklungsumgebung: uebungen/entwicklungsumgebung.md
      - Erste Schritte mit C#: uebungen/helloworld.md
      - Git - Das erste Repository: uebungen/git.md
      - Git - Änderungen nachvollziehen: uebungen/git-commit.md
      - Git - Änderungen rückgängig machen: uebungen/git-change.md
      - Github - Repository erstellen und verbinden: uebungen/github.md
      # - Variablen und Datentypen: uebungen/variablen-datentypen.md
      # - Einfache Ein- und Ausgabe: uebungen/einfach-ein-ausgabe.md
      # - Bedingungen (if, else, switch): uebungen/bedingungen.md
      # - Schleifen (for, while, do-while): uebungen/schleifen.md
      # - Funktionen (Methoden): uebungen/funktionen-methoden.md
      # - Arrays und Listen: uebungen/arrays-listen.md
      # - Klassen und Objekte: uebungen/klassen-objekte.md
      # - Fehlerbehandlung (try-catch): uebungen/fehlerbehandlung.md
      # - Arbeiten mit Dateien: uebungen/dateien.md
      # - Einführung in die objektorientierte Programmierung: uebungen/oop-einfuehrung.md-
  - Klassenregeln: regeln.md
  - Ressourcen:
      - Wichtige Terminal-Befehle: ressourcen/terminal.md
      #- Nützliche Links: ressourcen/links.md
